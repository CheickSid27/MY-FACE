services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myface}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myface}
      POSTGRES_DB: ${POSTGRES_DB:-myface}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myface}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Version epinglee (pas "latest") : une release recente (2025-09) avait un
    # bug de validation des URLs presignees (SignatureDoesNotMatch meme pour
    # une URL generee par le client officiel mc contre son propre serveur).
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    # DATABASE_URL et les identifiants S3 viennent maintenant de .env (Neon +
    # R2 en prod) ; db/minio locaux restent disponibles pour la suite de
    # tests (TEST_DATABASE_URL) et comme filet de secours, mais ne sont plus
    # forces via une variable d'environnement en dur ici.
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - insightface-models:/root/.insightface
      # Dossier surveille (ingestion auto) : ./watched-photos/<event_id>/ sur
      # le PC hote = /watched/<event_id>/ dans le conteneur. Copier les photos
      # de la carte SD de l'appareil dedans (a la main ou via un logiciel de
      # transfert automatique) les fait apparaitre dans l'evenement sans
      # passer par l'upload manuel. Voir services/folder_watcher.py.
      - ./watched-photos:/watched
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      # Build de production (voir frontend/Dockerfile) : les NEXT_PUBLIC_*
      # sont figees dans le bundle JS a la compilation, donc passees en build
      # args (lues depuis .env par docker compose automatiquement), pas
      # seulement via env_file qui n'agirait qu'au demarrage du process.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PAYMENT_PROVIDER: ${NEXT_PUBLIC_PAYMENT_PROVIDER}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    # Pas de bind-mount du code source ici (contrairement au backend) : ce
    # conteneur sert le build de production compile dans l'image
    # (.next/standalone), un bind-mount de ./frontend:/app l'ecraserait par
    # le code source brut non compile.

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"

  # Tunnel "quick" Cloudflare (aucun compte requis) : expose l'app (nginx)
  # sur une URL publique https://xxxx.trycloudflare.com. Solution retenue
  # pour le blocage "pas d'acces public" tant qu'on utilise le GPU local
  # (voir discussion) plutot qu'un serveur cloud payant. URL ephemere,
  # change a chaque redemarrage : voir `docker compose logs -f tunnel-app`.
  # A remplacer par un tunnel nomme (URL stable) des qu'un nom de domaine
  # est ajoute au compte Cloudflare.
  tunnel-app:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    profiles: ["quick"]

  # Tunnel Cloudflare NOMME : adresse publique fixe (https://myfaceci.online).
  # Le tunnel et le nom d'hote se creent dans le tableau de bord Cloudflare
  # (Zero Trust > Networks > Tunnels), qui fournit un jeton. Ce jeton se colle
  # dans .env (CLOUDFLARE_TUNNEL_TOKEN=...) et ne doit jamais etre partage.
  # Le service cible a declarer dans le tableau de bord : http://nginx:80
  # Demarrage :  docker compose --profile domaine up -d tunnel-domaine
  tunnel-domaine:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    profiles: ["domaine"]

volumes:
  postgres-data:
  minio-data:
  insightface-models:
