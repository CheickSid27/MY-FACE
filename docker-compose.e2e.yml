# Copie de test COMPLETE et ISOLEE de MYFACE, pour essayer les parcours dans
# un navigateur (inscription, confirmation d'e-mail, evenement, photos,
# invite, panier...) sans jamais toucher a Neon ni a Cloudflare R2 :
#   - base Postgres et stockage MinIO a elle, vides au demarrage ;
#   - adresse : http://localhost:8088 (ce PC seulement) ;
#   - IA sur le processeur (la carte graphique reste a la vraie application) ;
#   - aucun e-mail ne part : les liens s'affichent dans les logs du backend.
#
# Demarrer :  docker compose -f docker-compose.e2e.yml -p myface-e2e up -d --build
# Liens recus « par e-mail » :
#             docker compose -f docker-compose.e2e.yml -p myface-e2e logs backend | findstr token=
# Arreter et tout effacer :
#             docker compose -f docker-compose.e2e.yml -p myface-e2e down -v
#
# Les identifiants ci-dessous ne servent qu'a cette copie de test.

x-backend-env: &backend-env
  ENVIRONMENT: development
  SECRET_KEY: e2e-cle-de-test-uniquement-0123456789abcdef0123456789
  DATABASE_URL: postgresql+asyncpg://myface:myface@db:5432/myface
  TEST_DATABASE_URL: postgresql+asyncpg://myface:myface@db:5432/myface_test
  STORAGE_BACKEND: local
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: myface-photos
  S3_PUBLIC_URL: http://localhost:9088
  APP_BASE_URL: http://localhost:8088
  CORS_ORIGINS: http://localhost:8088
  INITIAL_ADMIN_EMAIL: admin.e2e@example.com
  INITIAL_ADMIN_PASSWORD: E2e-admin-2026
  FACE_RECOGNITION_PROVIDERS: CPUExecutionProvider
  PAYMENT_PROVIDER: manual
  PAYMENT_WEBHOOK_SECRET: e2e-webhook-secret
  # Verification de l'e-mail exigee (comme en production une fois le SMTP
  # configure), sans SMTP : les liens sont lus dans les logs.
  EMAIL_VERIFICATION_REQUIRED: "true"
  RETENTION_ENABLED: "false"
  DB_KEEPALIVE_SECONDS: "0"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: myface
      POSTGRES_PASSWORD: myface
      POSTGRES_DB: myface
    volumes:
      - e2e-postgres:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myface"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - e2e-minio:/data
    # Les apercus des photos sont servis par des liens signes vers MinIO :
    # le navigateur doit pouvoir le joindre (ce PC seulement).
    ports:
      - "127.0.0.1:9088:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # modeles d'IA deja telecharges par la vraie application : rien a
      # retelecharger (lecture seule)
      - insightface-models:/root/.insightface:ro
      - e2e-watched:/watched

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_PAYMENT_PROVIDER: manual
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ""
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "127.0.0.1:8088:80"

volumes:
  e2e-postgres:
  e2e-minio:
  e2e-watched:
  insightface-models:
    external: true
    name: myface_insightface-models
