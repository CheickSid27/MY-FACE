[project]
name = "myface-backend"
version = "0.1.0"
description = "MYFACE API - FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.2",
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    "pillow>=10.4.0",
    "boto3>=1.35.0",
    "httpx>=0.27.2",
    "pgvector>=0.3.5",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.19.0",
    "opencv-python-headless>=4.10.0.84",
    "scikit-learn>=1.5.2",
    "numpy>=1.26.4",
    "qrcode>=7.4.2",
    "africastalking>=1.2.9",
    "pywebpush>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures ET tests sur la meme boucle (session) : avec des tests en boucle
# "function" et des fixtures en boucle "session", une connexion asyncpg
# ouverte dans une boucle etait fermee depuis l'autre ("attached to a
# different loop" au teardown de test_faces.py).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
