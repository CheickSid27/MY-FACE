events {
    worker_connections 1024;
}

http {
    # 500M et pas 50M : un lot de 20 photos plein format (batch upload,
    # voir BatchUploader.tsx) peut peser 70-80 Mo+ vu qu'on preserve
    # l'original sans compression (aucune degradation qualite). 50M causait
    # des 413 sur la plupart des lots reels, observe en usage (upload de 114
    # photos : 5 lots sur 6 rejetes avant ce correctif).
    client_max_body_size 500M;

    # Adresse IP reelle du client. En production, tout le trafic arrive par le
    # conteneur cloudflared (Cloudflare Tunnel) : sans ceci, nginx voyait la
    # MEME adresse (celle du conteneur) pour tous les invites, et les limites
    # ci-dessous devenaient globales (10 scans/min pour tout l'evenement).
    # Le tunnel (cloudflared ou Tailscale Funnel) transmet l'adresse du client
    # dans X-Forwarded-For ; on ne fait confiance a cet en-tete que venant du
    # reseau Docker, c'est-a-dire du tunnel lui-meme.
    # Depuis le 27/09 on passe par le tunnel Cloudflare nomme
    # (https://myfaceci.online) : cloudflared transmet l'adresse du visiteur
    # dans X-Forwarded-For, verifie dans les logs. Les limites ci-dessous
    # sont donc de nouveau PAR VISITEUR, et resserrees.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Limites anti-abus, par IP client. Cibles choisies car exposees
    # publiquement (aucune auth) et couteuses : login (brute-force), scan
    # facial (inference GPU par appel) et groupes de visages publics.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=facescan_zone:10m rate=12r/m;
    limit_req_zone $binary_remote_addr zone=clusters_zone:10m rate=40r/m;

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    server {
        listen 80;

        location = /api/auth/login {
            limit_req zone=login_zone burst=3 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/faces/scan {
            limit_req zone=facescan_zone burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~ ^/api/events/[^/]+/clusters/public$ {
            limit_req zone=clusters_zone burst=10 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Premier calcul d'un evenement (avant mise en cache, voir
            # services/face_clusters.py) : peut depasser les 60 s par defaut
            # de nginx sur un gros evenement (504 observes auparavant).
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Telechargements (zip de la commande genere et envoye au fil de
        # l'eau) : transmis au client sans mise en tampon, et sans limite de
        # 60 s pour une grosse commande d'originaux.
        location /api/download/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Un lot de 20 photos = generation thumbnail/preview + 3 uploads
            # R2 par photo, tout en synchrone dans la requete : peut depasser
            # le defaut nginx (60s) sur un gros lot. Observe : 504 sur un lot
            # de 14 photos avec le defaut.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
