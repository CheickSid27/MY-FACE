events {
    worker_connections 1024;
}

http {
    # 500M et pas 50M : un lot de 20 photos plein format (batch upload,
    # voir BatchUploader.tsx) peut peser 70-80 Mo+ vu qu'on preserve
    # l'original sans compression (aucune degradation qualite). 50M causait
    # des 413 sur la plupart des lots reels, observe en usage (upload de 114
    # photos : 5 lots sur 6 rejetes avant ce correctif).
    client_max_body_size 500M;

    # Limites anti-abus, par IP. Cibles choisies car exposees publiquement
    # (aucune auth) et couteuses : login (brute-force), scan facial (inference
    # GPU par appel) et le clustering public (recalcule un DBSCAN complet sur
    # tous les visages de l'evenement a chaque requete, aucun cache).
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=facescan_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=clusters_zone:10m rate=10r/m;

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    server {
        listen 80;

        location = /api/auth/login {
            limit_req zone=login_zone burst=3 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/faces/scan {
            limit_req zone=facescan_zone burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ~ ^/api/events/[^/]+/clusters/public$ {
            limit_req zone=clusters_zone burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Un lot de 20 photos = generation thumbnail/preview + 3 uploads
            # R2 par photo, tout en synchrone dans la requete : peut depasser
            # le defaut nginx (60s) sur un gros lot. Observe : 504 sur un lot
            # de 14 photos avec le defaut.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
