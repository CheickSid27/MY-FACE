events {
    worker_connections 1024;
}

http {
    # 500M et pas 50M : un lot de 20 photos plein format (batch upload,
    # voir BatchUploader.tsx) peut peser 70-80 Mo+ vu qu'on preserve
    # l'original sans compression (aucune degradation qualite). 50M causait
    # des 413 sur la plupart des lots reels, observe en usage (upload de 114
    # photos : 5 lots sur 6 rejetes avant ce correctif).
    client_max_body_size 500M;

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    server {
        listen 80;

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Un lot de 20 photos = generation thumbnail/preview + 3 uploads
            # R2 par photo, tout en synchrone dans la requete : peut depasser
            # le defaut nginx (60s) sur un gros lot. Observe : 504 sur un lot
            # de 14 photos avec le defaut.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
